[workspace]
members = ["crates/glint-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Frame scaling runs on every captured frame. Unoptimized it is slow enough to make the
# preview in `tauri dev` stutter.
[profile.dev.package.glint-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
