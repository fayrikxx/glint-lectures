name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: cargo fmt --all -- --check
      # tauri::generate_context! embeds dist/, so the frontend has to be built before clippy.
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # tauri build sets this from bundle.macOS.minimumSystemVersion. The test steps need
      # the same value, or objc2's C helper and everything built on top of it compile again.
      # Windows ignores it.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A debug build shares compiled dependencies with `cargo test`, so the tests below
      # only rebuild our own crates. tauri build runs `npm run build` first, which also
      # gives generate_context! the dist/ it embeds.
      - run: npm run tauri -- build --debug --no-bundle
      # Same feature as tauri build turns on, otherwise tauri gets compiled a second time.
      # Runs the platform tests (window_list) that the Linux job can't.
      - run: cargo test --workspace --features tauri/custom-protocol
      # The Linux job never sees the Windows and macOS code, so it gets linted here.
      - run: cargo clippy --workspace --all-targets --features tauri/custom-protocol -- -D warnings
      # Tests with real windows. On Windows one gets captured and another one gets covered,
      # on macOS Calculator gets captured. It's not clear that hosted runners have a desktop
      # session capture works in, so a failure here doesn't fail the build.
      - name: test with real windows
        continue-on-error: true
        run: cargo test -p glint --features tauri/custom-protocol -- --ignored
