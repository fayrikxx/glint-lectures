name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: cargo fmt --all -- --check
      # tauri::generate_context! embeds dist/, so the frontend has to be built before clippy.
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A debug build shares compiled dependencies with `cargo test`, so the tests below
      # only rebuild our own crates. tauri build runs `npm run build` first, which also
      # gives generate_context! the dist/ it embeds.
      - run: npm run tauri -- build --debug --no-bundle
      # Same feature as tauri build turns on, otherwise tauri gets compiled a second time.
      # Runs the platform tests (window_list) that the Linux job can't.
      - run: cargo test --workspace --features tauri/custom-protocol
        env:
          # tauri build sets this from bundle.macOS.minimumSystemVersion (10.13 by default).
          # Without it objc2's C helper and everything built on top of it compile again.
          MACOSX_DEPLOYMENT_TARGET: "10.13"
